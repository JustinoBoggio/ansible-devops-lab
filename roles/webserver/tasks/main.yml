---
# Playbook to configure a basic web server using Nginx
- name: Install essential system packages
  apt:
    # We use the magic variable 'item' which holds the current value of the loop
    name: "{{ item }}"
    state: present
    update_cache: yes
  # The loop keyword iterates over our defined list
  loop: "{{ system_packages }}"

- name: Ensure Nginx is installed
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Ensure Nginx is running
  # Note: In some Docker containers without systemd, 
  # we use the service name directly.
  service:
    name: nginx
    state: started

- name: Deploy normal index page
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: '0644'
  # Logic: Only run this task if maintenance_mode is FALSE
  when: not (maintenance_mode | bool)
  notify: restart nginx # This matches the name in handlers/main.yml

- name: Deploy maintenance page
  template:
    src: maintenance.html.j2
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: '0644'
  # Logic: Only run this task if maintenance_mode is TRUE
  when: maintenance_mode | bool
  notify: restart nginx