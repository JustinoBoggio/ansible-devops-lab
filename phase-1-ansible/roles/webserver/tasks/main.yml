---
# Playbook to configure a basic web server using Nginx

# 1. Load the encrypted secrets
- name: Include secrets
  include_vars: secrets.yml

- name: Install essential system packages
  apt:
    # We use the magic variable 'item' which holds the current value of the loop
    name: "{{ item }}"
    state: present
    update_cache: yes
  # The loop keyword iterates over our defined list
  loop: "{{ system_packages }}"

- name: Ensure Nginx is installed
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Ensure Nginx is running
  # Note: In some Docker containers without systemd, 
  # we use the service name directly.
  service:
    name: nginx
    state: started
    enabled: yes

- name: Install Python Flask and DB Driver
  pip:
    name:
      - flask
      - psycopg2-binary
    state: present

# --- Static Content & Maintenance Mode (Legacy/Landing Page) ---
- name: Deploy normal index page
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: '0644'
  # Logic: Only run this task if maintenance_mode is FALSE
  when: not (maintenance_mode | bool)
  notify: restart nginx # This matches the name in handlers/main.yml

- name: Deploy maintenance page
  template:
    src: maintenance.html.j2
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: '0644'
  # Logic: Only run this task if maintenance_mode is TRUE
  when: maintenance_mode | bool
  notify: restart nginx

- name: Security - Hide Nginx version in HTTP headers
  lineinfile:
    path: /etc/nginx/nginx.conf
    # Regex explanation:
    # ^\s* -> Line starts with matching spaces (optional)
    # #?    -> Can have a comment hash '#' (optional)
    # \s* -> Spaces after comment (optional)
    # server_tokens -> The literal text "server_tokens"
    regexp: '^\s*#?\s*server_tokens\s+'
    # The final line we want in the file
    line: '	server_tokens off;'
    # If the regex is not found, where should we add the line? (Optional)
    insertafter: 'http {'
    state: present
  notify: restart nginx

# --- Educational Task: Error Handling Demo (Optional) ---
- name: Download optional company logo
  get_url:
    url: "http://google.com/this-file-does-not-exist.png"
    dest: /var/www/html/logo.png
  # Don't stop the playbook if this fails
  ignore_errors: yes
  # Save the result (success or failure) into a variable
  register: logo_download_result

- name: Report download status
  debug:
    msg: "⚠️ WARNING: The custom logo could not be downloaded. Using default."
  # Logic: Only run this if the previous task failed
  when: logo_download_result is failed

# --- Application Deployment ---
- name: Deploy Application Code
  copy:
    src: files/app.py
    dest: /opt/app.py
    mode: '0755'

- name: Kill running Flask app
  shell: "pkill -f app.py || true"
  ignore_errors: yes

- name: Run Flask App in Background
  shell: |
    nohup python3 /opt/app.py > /var/log/flask.log 2>&1 &
  environment:
    # Inject DB connection details from Ansible variables
    DB_HOST: "{{ db_host }}"   # Come from node 2 inventory
    DB_NAME: "myappdb"         # hardcoded for simplicity
    DB_USER: "myappuser"
    DB_PASS: "{{ db_password }}"
  async: 10
  poll: 0

# --- Connectivity Check ---
- name: Verify connectivity to PostgreSQL
  wait_for:
    host: "{{ db_host }}"
    port: 5432
    timeout: 5
    state: started
    msg: "Timeout waiting for Database to respond on port 5432"