---
name: Ansible CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install ansible ansible-lint passlib

      - name: Create Vault Pass File
        run: |
          echo "${{ secrets.VAULT_PASSWORD }}" > .vault_pass
          echo "${{ secrets.VAULT_PASSWORD_CLOUD }}" > phase-4-ansible-cloud/.vault_pass

      - name: Run Ansible Lint (Phase 1)
        run: |
          cd phase-1-ansible
          ansible-lint
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: ${{ github.workspace }}/.vault_pass

      - name: Run Ansible Lint (Phase 4)
        run: |
          cd phase-4-ansible-cloud
          ansible-lint

      - name: Run Ansible Syntax Check (Phase 1)
        run: |
          cd phase-1-ansible
          ansible-playbook site.yml --syntax-check
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: ${{ github.workspace }}/.vault_pass

      - name: Run Ansible Syntax Check (Phase 4)
        run: |
          cd phase-4-ansible-cloud
          ansible-playbook site.yml --syntax-check