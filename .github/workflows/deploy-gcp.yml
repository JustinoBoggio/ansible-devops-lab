name: Deploy Infrastructure and App to GCP

on:
  workflow_dispatch:

jobs:
  ansible-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install Ansible and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible requests google-auth google-auth-oauthlib passlib

      - name: 🔑 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/gcp_key
          chmod 600 ~/.ssh/gcp_key

      - name: 🔐 Setup Vault Password
        run: |
          echo "${{ secrets.VAULT_PASSWORD_CLOUD }}" > phase-4-ansible-cloud/.vault_pass

      - name: ☁️ Authenticate to Google Cloud
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > phase-4-ansible-cloud/gcp-credentials.json

      - name: 🏗️ Provision GCP Infrastructure (VM & Network)
        working-directory: ./phase-4-ansible-cloud
        run: ansible-playbook provision_vm.yml

      - name: ⚙️ Configure Server with Ansible Roles
        working-directory: ./phase-4-ansible-cloud
        run: ansible-playbook site.yml

      - name: 🧹 Cleanup Secrets (Security Best Practice)
        if: always()
        working-directory: ./phase-4-ansible-cloud
        run: |
          rm -f gcp-credentials.json
          rm -f .vault_pass
          rm -f ~/.ssh/gcp_key