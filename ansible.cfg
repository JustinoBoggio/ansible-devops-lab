[defaults]
# Use the local hosts.ini as the default inventory
inventory = hosts.ini

# Stop showing the cowsay (if installed) or other cosmetic stuff
nocows = 1

# If you want to suppress the deprecation warnings after you've handled them:
deprecation_warnings = False

# Location for temporary files on the control node
remote_tmp = /tmp/.ansible/tmp

# FIX for the permission denied warning when switching users
allow_world_readable_tmpfiles = True

# Path to the vault password file
vault_password_file = .vault_pass

[ssh_connection]
# Senior Optimization: Pipelining reduces the number of SSH operations required
# It creates a pipe directly to the SSH session instead of copying files.
pipelining = True