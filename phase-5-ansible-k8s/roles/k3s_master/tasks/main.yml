---
- name: Install K3s on Master Node
  shell: curl -sfL https://get.k3s.io | sh -
  environment:
    INSTALL_K3S_EXEC: "server --tls-san {{ ansible_host }}"
  args:
    creates: /usr/local/bin/k3s

- name: Wait for node-token to be generated
  wait_for:
    path: /var/lib/rancher/k3s/server/node-token

- name: Read node-token from Master (Using Slurp)
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: node_token_b64

- name: Store Master node-token as a cross-host fact
  set_fact:
    k3s_token: "{{ node_token_b64['content'] | b64decode | trim }}"

- name: Fetch kubeconfig to local machine
  fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: ~/.kube/config_gcp
    flat: yes