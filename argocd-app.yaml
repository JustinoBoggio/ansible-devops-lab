apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-app-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JustinoBoggio/ansible-devops-lab.git
    targetRevision: main
    path: phase-3-helm/my-python-app # Exact path to the Helm chart within the repo
    
  destination:
    server: https://kubernetes.default.svc
    namespace: ansible-lab # Namespace where the app will be deployed

  # Sync Policy: Automated with Prune and Self-Heal
  syncPolicy:
    automated:
      prune: true    # If deleted a file from git, ArgoCD will delete it from the cluster
      selfHeal: true # If someone changes something manually in the cluster, ArgoCD will revert it to match git
    syncOptions:
      - CreateNamespace=true