# Default values for my-python-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: justinoboggio0714/my-python-app
  pullPolicy: Always # Critical for Kind
  tag: "v1"

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30000

database:
  host: postgres-service
  name: myappdb
  user: postgres