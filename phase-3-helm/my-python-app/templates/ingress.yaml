---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "my-python-app.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-python-app-service
                port:
                  number: 80